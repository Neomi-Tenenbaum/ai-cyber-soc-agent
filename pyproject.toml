[project]
name = "ai-cyber-soc-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "neomifodor", email = "neomifodor@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.7.22",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.15",
    "mcp>=2.3.0",
    "nest-asyncio>=1.6.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-cyber-soc-agent = "ai_cyber_soc_agent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
